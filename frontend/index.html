<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest's icons and reads this instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the installed app draw under the notch; the
         masthead pads itself back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Watch Order" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050507" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <meta
      name="description"
      content="The Marvel catalog in release, chronological and custom viewing orders, with a prerequisite chain for every title."
    />
    <title>Marvel Watch Order</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
