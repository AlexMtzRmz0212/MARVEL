<!-- Source artwork for the installed-app icons. The circular silhouette leaves
     transparent corners so the mark reads as an app icon instead of a tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="disc" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#3a2533" />
      <stop offset="1" stop-color="#17171c" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe66b" />
      <stop offset="1" stop-color="#f2b900" />
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff66aa" />
      <stop offset="1" stop-color="#ce176c" />
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="15.4" fill="url(#disc)" stroke="#524239" stroke-width=".7" />
  <circle cx="16" cy="16" r="13.8" fill="none" stroke="#e5bd51" stroke-opacity=".52" stroke-width=".6" />

  <!-- Two story paths join at the featured title, like a tiny timeline map. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.1 9.2C11.3 9.2 12.6 12 16 16" stroke="#09090c" stroke-width="5.1" />
    <path d="M8.1 22.8C11.3 22.8 12.6 20 16 16" stroke="#09090c" stroke-width="5.1" />
    <path d="M16 16h7.1" stroke="#09090c" stroke-width="5.1" />
    <path d="M8.1 9.2C11.3 9.2 12.6 12 16 16" stroke="url(#gold)" stroke-width="2.5" />
    <path d="M8.1 22.8C11.3 22.8 12.6 20 16 16" stroke="url(#magenta)" stroke-width="2.5" />
    <path d="M16 16h7.1" stroke="#f3eee0" stroke-width="2.5" />
  </g>

  <g stroke="#f3eee0" stroke-width="1.35">
    <circle cx="8.1" cy="9.2" r="2.55" fill="#17171c" />
    <circle cx="8.1" cy="22.8" r="2.55" fill="#17171c" />
  </g>
  <circle cx="23.1" cy="16" r="2.75" fill="#f3eee0" stroke="#17171c" stroke-width="1.15" />
  <circle cx="16" cy="16" r="4.25" fill="url(#gold)" stroke="#17171c" stroke-width="1.6" />
  <circle cx="16" cy="16" r="1.35" fill="#ce176c" />
</svg>
