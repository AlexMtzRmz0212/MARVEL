<!--
  Two prerequisites converging on the title they unlock: the app's one idea,
  drawn small. Colours come from the palette in index.css (surface, hairline,
  and the infinity amber that marks the title in focus everywhere else).

  Sized for a 16px tab first: three nodes and two edges is the most a favicon
  can carry legibly, so the graph is trimmed to exactly that.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="31" height="31" x=".5" y=".5" fill="#121215" stroke="#3a3a42" rx="7" />
  <g stroke="#64615c" stroke-width="2.2" stroke-linecap="round">
    <path d="M9.5 9.5 22 16" />
    <path d="M9.5 22.5 22 16" />
  </g>
  <circle cx="9.5" cy="9.5" r="3.4" fill="#94908a" />
  <circle cx="9.5" cy="22.5" r="3.4" fill="#94908a" />
  <circle cx="22" cy="16" r="4.6" fill="#e0a45e" />
</svg>
