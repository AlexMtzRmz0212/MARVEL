<!--
  Two prerequisites converging on the title they unlock, drawn the way the app
  draws everything: lines cased in ink, titles as stations. Colours are the
  palette in index.css -- newsprint, ink, process yellow and magenta -- and the
  frame flips for the night edition.

  Sized for a 16px tab first: three stations and two lines is the most a
  favicon can carry legibly.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .frame { fill: #e9ebe4; stroke: #17171c; }
    .case { stroke: #17171c; }
    .stop { fill: #f6f7f2; stroke: #17171c; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #15161b; stroke: #ecede6; }
      .case { stroke: #ecede6; }
      .stop { fill: #1e2027; stroke: #ecede6; }
    }
  </style>
  <rect class="frame" width="30" height="30" x="1" y="1" stroke-width="2" />
  <g fill="none" stroke-linecap="round">
    <path class="case" d="M9 9.5 22 16" stroke-width="5.4" />
    <path class="case" d="M9 22.5 22 16" stroke-width="5.4" />
    <path d="M9 9.5 22 16" stroke="#f2c200" stroke-width="2.6" />
    <path d="M9 22.5 22 16" stroke="#c8166e" stroke-width="2.6" />
  </g>
  <circle class="stop" cx="9" cy="9.5" r="3.2" stroke-width="1.8" />
  <circle class="stop" cx="9" cy="22.5" r="3.2" stroke-width="1.8" />
  <circle class="stop" cx="22" cy="16" r="4.4" stroke-width="2.2" />
</svg>
