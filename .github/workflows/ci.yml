name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts

      # No database service here: the catalog half of the API serves JSON, and
      # the account half runs against in-memory SQLite. The `postgres` job below
      # covers what that cannot -- the migration chain and the Postgres-only
      # parts of the schema.
      - name: Test
        working-directory: backend
        run: pytest -m "not postgres"

      # The catalog is a checked artifact. This is the same validation the app
      # runs at startup, so a bad edit fails here rather than at deploy.
      - name: Validate the catalog
        working-directory: backend
        run: python -m app.seed.loader --check

  # The only place the Alembic chain is actually run. Accounts made the schema
  # load bearing, so "the migrations apply and match the models" stopped being
  # something we could take on trust.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcu
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mcu
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mcu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      # Every custom_order_items.movie_id and watch_progress.movie_id is a
      # foreign key into `movies`, so an unseeded database cannot store an
      # order at all. This is the same command production needs after any
      # change to the seed file.
      - name: Seed
        working-directory: backend
        run: python -m app.seed.loader

      - name: Test
        working-directory: backend
        run: pytest -m postgres

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # These consume fixtures/validation_cases.json, the same file the backend
      # suite runs against. If the two validators drift, this job fails.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
