[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcu-watch-order"
version = "0.1.0"
description = "MCU watch-order API: catalog, prerequisite DAG, custom orders, progress"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "pwdlib[argon2]>=0.2.1",
    # Required by pydantic's EmailStr, which the registration schema uses.
    # Pydantic imports it lazily, so without this the failure is a runtime
    # ImportError on the first signup rather than anything at startup.
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.34",
    "pytest>=8.3",
    # starlette's TestClient prefers httpx2; plain httpx emits a deprecation warning.
    "httpx2>=0.29",
    "requests>=2.32",
    "python-dotenv>=1.0",
    # Verifies TLS against the OS trust store, so HTTPS-inspecting antivirus
    # and corporate proxies do not break the enrichment script.
    "truststore>=0.10",
    # Local-only GUI for editing the curated catalog (scripts/catalog_editor.py).
    # A developer tool, never shipped to the serverless function.
    "streamlit>=1.40",
    "streamlit-sortables>=0.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    # Needs a real Postgres in TEST_DATABASE_URL; skipped otherwise so the
    # default suite still runs on a laptop with nothing installed. The CI
    # postgres job is what actually exercises these.
    "postgres: requires a live Postgres database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
